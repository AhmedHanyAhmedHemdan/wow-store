<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wowBagGradient" x1="60" y1="90" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A2FF" />
      <stop offset="35%" stop-color="#0072FF" />
      <stop offset="75%" stop-color="#0051E8" />
      <stop offset="100%" stop-color="#0038C7" />
    </linearGradient>
    <linearGradient id="wowHandleGradient" x1="160" y1="35" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="40%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="wowSparkGradient" x1="140" y1="170" x2="230" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="wowDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#001859" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Orange Handle -->
  <path d="M 175 160 C 175 60, 337 60, 337 160" stroke="url(#wowHandleGradient)" stroke-width="36" stroke-linecap="round" fill="none" />

  <!-- Blue Bag -->
  <rect x="72" y="118" width="368" height="348" rx="84" fill="url(#wowBagGradient)" />

  <!-- Eyelets -->
  <circle cx="175" cy="155" r="20" fill="#FFFFFF" />
  <circle cx="175" cy="155" r="12" fill="#0066E0" />
  <circle cx="337" cy="155" r="20" fill="#FFFFFF" />
  <circle cx="337" cy="155" r="12" fill="#0066E0" />

  <!-- Sparks -->
  <path d="M 188 180 L 222 170 C 228 172, 230 180, 226 245 C 220 252, 212 250, 196 235 L 188 180 Z" fill="url(#wowSparkGradient)" />
  <path d="M 148 214 L 180 230 C 185 236, 182 245, 172 270 C 165 274, 155 272, 142 254 L 148 214 Z" fill="url(#wowSparkGradient)" />

  <!-- Letter Waw -->
  <g filter="url(#wowDropShadow)">
    <path d="M 292 200 C 345 200, 382 238, 382 292 C 382 350, 340 385, 290 385 C 255 385, 230 368, 230 335 C 230 290, 275 242, 335 242 C 348 242, 352 254, 345 272 C 332 305, 285 338, 255 338 C 246 338, 244 326, 250 308 C 262 268, 305 235, 335 235 C 300 235, 262 265, 250 305 C 236 348, 260 380, 295 380 C 324 380, 350 358, 358 332 C 348 375, 285 412, 212 424 C 170 431, 140 405, 140 388 C 140 382, 160 384, 185 375 C 240 352, 295 305, 295 265 C 295 235, 270 218, 250 226 C 240 215, 265 200, 292 200 Z" fill="#FFFFFF" />
    <path d="M 330 258 C 310 258, 280 282, 270 310 C 268 316, 274 320, 282 316 C 305 302, 338 280, 342 265 C 344 260, 338 258, 330 258 Z" fill="#005BE8" />
  </g>
</svg>
